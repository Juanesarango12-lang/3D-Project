<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#04060a;--glass:rgba(18,26,38,.62);--line:rgba(120,170,230,.14);--fg:#e6eef8;--mut:#8497ad;--ac:#4cb3ff;--ac2:#7a8cff;--r:16px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}

svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:10px;padding:14px 18px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 0 20px rgba(76,179,255,.4)}
.logo svg{width:15px;height:15px;stroke:#04101f}
header b{font-weight:600;letter-spacing:.2px}header span{color:var(--mut);font-size:12px;margin-left:auto}
main{display:grid;grid-template-columns:1fr;gap:16px;padding:0 14px 24px;max-width:1180px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:1fr 400px;align-items:start;padding:0 24px 32px}.view{position:sticky;top:12px}}
.view{display:flex;flex-direction:column;align-items:center;gap:12px}
#stage{position:relative;height:min(64vh,640px);aspect-ratio:9/16;max-width:100%;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(30,110,255,.35),0 0 0 6px rgba(255,255,255,.015)}
@media(min-width:900px){#stage{height:calc(100vh - 150px);max-height:860px}}
canvas{width:100%;height:100%;display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:24px;pointer-events:none;transition:opacity .4s}

@keyframes fl{50%{transform:translateY(-6px)}}
.has #empty{opacity:0}
#rec{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:7px;background:rgba(10,14,20,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,80,80,.4);font-size:11px;font-weight:600;letter-spacing:.8px;padding:5px 10px;border-radius:99px}
#rec i{width:7px;height:7px;border-radius:50%;background:#ff4a4a;animation:pu 1s infinite}@keyframes pu{50%{opacity:.25}}
#load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,10,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
#load.on{opacity:1}.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--ac);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:100%;max-width:360px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.transport{display:flex;gap:8px;width:100%;max-width:360px}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}
.drop{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;border-style:dashed;transition:.25s}
.drop:hover,.drop.over{border-color:var(--ac);background:rgba(40,110,200,.14);transform:translateY(-1px)}

.ic img{width:100%;height:100%;object-fit:cover}
.drop b{font-size:14px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.drop small{color:var(--mut);font-size:12px}
.tag{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(76,179,255,.14);color:var(--ac);display:none;white-space:nowrap}
.has .tag{display:block}
button{font:inherit;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;font-size:14px;font-weight:500}
button:hover{background:rgba(255,255,255,.09);border-color:rgba(120,170,230,.35)}button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#03101e;border:0;font-weight:600;box-shadow:0 8px 24px -8px rgba(76,150,255,.7)}

button:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:500;font-size:14px}
.sec>summary::-webkit-details-marker{display:none}.sec>summary .ch{margin-left:auto;transition:transform .3s;color:var(--mut)}
.sec[open]>summary .ch{transform:rotate(180deg)}
.sec>summary svg:first-child{color:var(--ac)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.sec[open] .body{grid-template-rows:1fr}
.body>div{overflow:hidden}.in{padding:2px 16px 14px;display:flex;flex-direction:column;gap:16px}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.sl label b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac2)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.1)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--ac)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(76,179,255,.25),0 2px 8px rgba(0,0,0,.5);transition:box-shadow .2s}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(76,179,255,.3),0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
video{width:100%;display:none;border-radius:12px;background:#000;max-height:50vh}
.res{padding:12px;display:none;flex-direction:column;gap:10px}.res.on{display:flex;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
#dl{display:none;text-decoration:none;color:var(--fg)}
.note{font-size:12px;color:var(--mut);line-height:1.5;padding:0 4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:rgba(20,28,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:13px;transition:.35s;z-index:9;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:#ff6a6a}
#stage{transition:aspect-ratio .3s}
#stage.h{height:auto;width:100%;max-height:none;aspect-ratio:16/9}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px}

.seg button.on{background:linear-gradient(135deg,rgba(76,179,255,.22),rgba(122,140,255,.22));color:var(--fg);box-shadow:inset 0 0 0 1px rgba(120,170,255,.4),0 6px 20px -8px rgba(76,150,255,.6)}

.pre button{flex-direction:column;gap:6px;min-height:62px;padding:8px 4px;font-size:11.5px}

@media(max-width:560px){.pre{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}.pre::-webkit-scrollbar{display:none}.pre button{flex:0 0 84px;scroll-snap-align:start}}
</style></head><body>
<header><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></div><b>Collage 3D Studio</b><span>1080 × 1920 · 9:16</span></header>
<main id="app">
 <section class="view">
  <div id="stage"><canvas id="cv"></canvas>
   <div id="empty"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Sube una imagen vertical,<br>cuadrada u horizontal</div>
   <div id="rec"><i></i>GRABANDO</div><div id="load"><div class="spin"></div></div></div>

   <button id="play"><svg viewBox="0 0 24 24" id="pi"><path d="M7 5v14M17 5v14"/></svg><span id="pt">Pausa</span></button>
   <button id="restart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reiniciar</button>
  </div>
 </section>
 <section class="side">
  <div class="card seg" id="seg"><button data-f="v" class="on"><i style="width:14px;height:24px"></i>VERTICAL 9:16</button><button data-f="h"><i style="width:26px;height:15px"></i>HORIZONTAL 16:9</button></div>
  <label class="card drop" id="drop" for="file"><div class="ic" id="ic"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
   <div><b id="fn">Subir imagen</b><small id="fs">Arrastra o toca · PNG, JPG</small></div><span class="tag" id="tag"></span></label>
  <input id="file" type="file" accept="image/png,image/jpeg,image/*" hidden>
  <div id="panels" class="side"></div>
  <button class="p" id="export" disabled style="min-height:52px;flex:none"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg><span id="et">Exportar video</span></button>
  <div class="card res" id="res"><video id="out" controls playsinline></video><a id="dl" class="btn"></a><button as="a" id="dlb" class="p" style="display:none"></button></div>

 </section>
</main><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const P={speed:1,d3:1,fov:40,glow:1,blur:1,dur:12,rx:-47.44,ry:11.46,rz:0,tilt:0,dist:1,fmt:'v'};
const ICO={m:'<path d="M5 12h14M13 6l6 6-6 6"/>',c:'<path d="M3 7h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>',l:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
ICO.p='<path d="M3 18L8 6h8l5 12z"/>';
const ctrl={};
const PRE=[['Frontal','<rect x="5" y="5" width="14" height="14" rx="1.5"/>',{rx:-8,ry:0,rz:0,tilt:0,dist:1,fov:40}],
['Desde arriba','<path d="M8 6h8l4 12H4z"/>',{rx:-78,ry:0,rz:0,tilt:22,dist:1,fov:45}],
['Desde abajo','<path d="M4 6h16l-4 12H8z"/>',{rx:52,ry:0,rz:0,tilt:-22,dist:1,fov:45}],
['Lateral','<path d="M5 8l9-3v14l-9-3z"/>',{rx:-15,ry:68,rz:0,tilt:6,dist:.9,fov:50}],
['Diagonal','<path d="M6 7l11-2 2 12L8 19z"/>',{rx:-40,ry:32,rz:-6,tilt:10,dist:1,fov:42}],
['Cinemática','<path d="M9 5h9l-3 14H4z"/><path d="M19 3v4M17 5h4"/>',{rx:-47.44,ry:11.46,rz:0,tilt:0,dist:1,fov:40}]];
const SL=[['m','Movimiento',[['speed','Velocidad (recorrido)',.3,1.5,.05,'×'],['dur','Duración',6,25,1,'s']]],
['p','Perspectiva',[['rx','Rotación X',-90,90,1,'°'],['ry','Rotación Y',-90,90,1,'°'],['rz','Rotación Z',-180,180,1,'°'],['tilt','Inclinación de cámara',-60,60,1,'°'],['dist','Distancia de cámara',.5,2,.05,'×'],['fov','Profundidad / perspectiva',20,80,1,'°'],['d3','Intensidad 3D',0,1.5,.05,'']],1],

SL.forEach(([ic,name,sl,isP])=>{const d=document.createElement('details');d.className='card sec';d.open=true;
 d.innerHTML='<summary><svg viewBox="0 0 24 24">'+ICO[ic]+'</svg>'+name.toUpperCase()+'<svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary><div class="body"><div><div class="in"></div></div></div>';
 const box=d.querySelector('.in');
 if(isP){const pr=document.createElement('div');pr.className='pre';PRE.forEach(([n,svg,v])=>{const bt=document.createElement('button');bt.innerHTML='<svg viewBox="0 0 24 24">'+svg+'</svg>'+n;bt.onclick=()=>{Object.assign(P,v);Object.keys(v).forEach(k=>ctrl[k]&&ctrl[k]());applyStatic();setCam();preBtns.forEach(x=>x.classList.remove('on'));bt.classList.add('on')};preBtns.push(bt);pr.append(bt)});preBtns[5].classList.add('on');box.append(pr)}
 sl.forEach(([k,n,mn,mx,st,u])=>{const w=document.createElement('div');w.className='sl';w.innerHTML='<label>'+n+'<b></b></label>';const i=document.createElement('input');i.type='range';i.min=mn;i.max=mx;i.step=st;i.value=P[k];const b=w.querySelector('b');
  const up=()=>{i.value=P[k];b.textContent=(+P[k].toFixed(2))+u;i.style.setProperty('--p',((P[k]-mn)/(mx-mn)*100)+'%')};up();ctrl[k]=up;
  i.oninput=()=>{P[k]=+i.value;up();applyStatic();if(k==='fov'||k==='dist')setCam();if(isP&&k!=='d3')preBtns.forEach(x=>x.classList.remove('on'))};w.append(i);box.append(w)});
 $('panels').append(d)});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{if(recording)return;P.fmt=b.dataset.f;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));$('stage').classList.toggle('h',P.fmt==='h');size(...pvSize());setCam()});

function setPlayUI(){$('pt').textContent=playing?'Pausa':'Play';$('pi').innerHTML=playing?'<path d="M7 5v14M17 5v14"/>':'<path d="M7 4l13 8-13 8z"/>'}
function setExportUI(on){$('et').textContent=on?'Grabando…':'Exportar video';$('export').disabled=on||!meshes.glow;$('rec').style.display=on?'flex':'none'}
const fmt=n=>n<1048576?(n/1024|0)+' KB':(n/1048576).toFixed(1)+' MB';
function loadFile(f){
 const dz=$('drop');dz.classList.remove('err');
 if(!f||!/^image\//.test(f.type)){dz.classList.add('err');toast('Archivo no válido. Usa PNG o JPG.');return}
 $('load').classList.add('on');const u=URL.createObjectURL(f);const i=new Image();
 i.onload=()=>{try{build(i)}catch(e){$('load').classList.remove('on');dz.classList.add('err');toast('No se pudo procesar la imagen.');return}
  const r=i.width/i.height,o=r>1.05?'Horizontal':r<.95?'Vertical':'Cuadrada';
  $('fn').textContent=f.name;$('fs').textContent=i.width+'×'+i.height+' · '+fmt(f.size);$('tag').textContent=o;
  $('ic').innerHTML='<img src="'+u+'" alt="">';$('app').classList.add('has');$('stage').classList.add('has');
  setTimeout(()=>$('load').classList.remove('on'),250);toast('Imagen cargada · '+o.toLowerCase(),1)};
 i.onerror=()=>{$('load').classList.remove('on');dz.classList.add('err');toast('No se pudo leer la imagen.')};i.src=u}
$('file').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};
const dz=$('drop');['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));

setInterval(()=>{if(window.uiEl!=null)$('prog').style.width=Math.min(100,window.uiEl%(P.dur+1.5)/P.dur*100)+'%'},100);
</script>

c+=(h(uv*1.7)-.5)*.02;gl_FragColor=vec4(c,1.);}`,depthTest:false,depthWrite:false}));

const pvSize=()=>P.fmt==='h'?[960,540]:[540,960],exSize=()=>P.fmt==='h'?[1920,1080]:[1080,1920];
function setCam(){cam.fov=P.fov;cam.aspect=P.fmt==='h'?16/9:9/16;const D=1.9/(Math.tan(P.fov*Math.PI/360)*(P.fmt==='h'?16/9:9/16))*P.dist;cam.userData.D=D;cam.position.set(0,0,D);cam.updateProjectionMatrix()}
function applyStatic(){if(meshes.glow){meshes.glow.material.opacity=Math.min(1,P.glow*.85)}const k=Math.min(1.5,P.d3),r=Math.PI/180;wall.rotation.x=P.rx*r*k;wall.rotation.y=P.ry*r*P.d3;wall.rotation.z=P.rz*r}

function build(img){
 while(wall.children.length)wall.remove(wall.children[0]);
 let src=img;const mt=R.capabilities.maxTextureSize;
 if(img.height>mt||img.width>mt){const k=Math.min(mt/img.height,mt/img.width);const c=document.createElement('canvas');c.width=img.width*k|0;c.height=img.height*k|0;c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c}
 const tex=new THREE.Texture(src);tex.anisotropy=R.capabilities.getMaxAnisotropy();tex.generateMipmaps=true;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.needsUpdate=true;
 H=W*img.height/img.width;const asp=H/W;
 const gl=new THREE.Mesh(new THREE.PlaneGeometry(W+2.2,H+2.2),new THREE.MeshBasicMaterial({map:glowTex('rgb(40,130,255)',70,(H+2.2)/(W+2.2)),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.85}));gl.position.z=-.25;
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(W+1.2,H+1.2),new THREE.MeshBasicMaterial({map:glowTex('rgb(0,0,0)',60,(H+1.2)/(W+1.2)),transparent:true,depthWrite:false,opacity:.9}));sh.position.set(.12,-.18,-.12);
 const pl=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.ShaderMaterial({uniforms:{map:{value:tex}},
 vertexShader:'varying vec2 vUv;varying float vZ;void main(){vUv=uv;vec4 m=modelViewMatrix*vec4(position,1.);vZ=-m.z;gl_Position=projectionMatrix*m;}',
 fragmentShader:'uniform sampler2D map;varying vec2 vUv;varying float vZ;void main(){vec3 c=texture2D(map,vUv).rgb;c*=vec3(.93,.97,1.04);float d=smoothstep(7.,15.,vZ);c*=mix(1.,.3,d);c+=vec3(0.,.03,.09)*d*.6;float e=min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y));c*=.92+.08*smoothstep(0.,.02,e);gl_FragColor=vec4(c,1.);}'}));
 gl.renderOrder=0;sh.renderOrder=1;pl.renderOrder=2;wall.add(gl,sh,pl);meshes={glow:gl};
 applyStatic();document.getElementById('export').disabled=false;T0=performance.now();
}

let playing=true,T0=performance.now(),pauseT=0,recording=false;
const btnP=document.getElementById('play');
btnP.onclick=()=>{playing=!playing;setPlayUI();if(playing)T0=performance.now()-pauseT*1000;};
document.getElementById('restart').onclick=()=>{T0=performance.now();pauseT=0;playing=true;setPlayUI()};

function size(w,h){R.setSize(w,h,false);rt.setSize(w,h);pq.material.uniforms.res.value.set(w,h)}
size(540,960);setCam();applyStatic();

function frame(now){
 requestAnimationFrame(frame);
 let el=(now-T0)/1000;if(!playing)el=pauseT;else pauseT=el;window.uiEl=el;
 const loopLen=P.dur+1.5;let t=recording?el:el%loopLen;
 let p=Math.min(1,t/P.dur);const e=p*p*(3-2*p);p=p*.45+e*.55;
 if(meshes.glow){
  const vf=P.fmt==='h'?.4:1,start=H/2+1.6*vf,end=-H/2+1.8*vf,tot=(H<4.7?4.5*vf:(start-end))*P.speed;
  wall.position.set(0,0,0);
  wall.children.forEach(c=>c.position.y=0);
  const y=start-tot*p;
  // move content along its local axis
  wall.children[0].position.y=wall.children[1].position.y=wall.children[2].position.y=y;
  wall.children[1].position.y=y-.18;
  const sw=.05*P.d3,tt=now/1000;
  const el=P.tilt*Math.PI/180,Dd=cam.userData.D;cam.position.set(Math.sin(tt*.3)*sw,Dd*Math.sin(el)+Math.cos(tt*.23)*sw*.6+.15*P.d3,Dd*Math.cos(el));cam.lookAt(0,0,0);
 }
 const u=pq.material.uniforms;u.blur.value=P.blur;u.glow.value=P.glow;u.time.value=(now%1000)/1000;
 R.setRenderTarget(rt);R.setClearColor(0x03060a);R.clear();R.render(scene,cam);
 u.t.value=rt.texture;R.setRenderTarget(null);R.render(pscene,pcam);
}
requestAnimationFrame(frame);

document.getElementById('export').onclick=async()=>{
 if(recording)return;const btn=document.getElementById('export');btn.disabled=true;setExportUI(true);
 const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 if(!mime){toast('Tu navegador no soporta la grabación de video.');btn.disabled=false;setExportUI(false);return}
 size(...exSize());recording=true;playing=true;T0=performance.now();pauseT=0;
 document.getElementById('rec').style.display='block';
 const stream=cv.captureStream(30);const rc=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});const ch=[];
 rc.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rc.onstop=()=>{const b=new Blob(ch,{type:mime.split(';')[0]});const url=URL.createObjectURL(b);const v=document.getElementById('out');v.src=url;v.style.display='block';document.getElementById('res').classList.add('on');
  const a=document.getElementById('dl');a.href=url;a.download='collage3d.'+(mime.includes('mp4')?'mp4':'webm');a.style.display='flex';a.className='btn';a.innerHTML='Descargar video';a.style.cssText='display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:linear-gradient(135deg,#4cb3ff,#7a8cff);color:#03101e;font-weight:600;font-size:14px';
  recording=false;size(...pvSize());document.getElementById('rec').style.display='none';btn.disabled=false;setExportUI(false);toast('Video listo',1);T0=performance.now()};
 rc.start();setTimeout(()=>rc.stop(),(P.dur+.6)*1000);
};

</script></body></html>
